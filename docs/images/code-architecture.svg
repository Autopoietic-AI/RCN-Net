<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="800" viewBox="0 0 2000 800" role="img" aria-labelledby="title desc">
  <title id="title">Code-accurate surgical phase classification pipeline</title>
  <desc id="desc">An external YOLO detector creates bounding boxes. The repository reads the boxes, makes a binary ROI mask, concatenates it with RGB, extracts multi-scale RegNetY features, applies co-attention and spatial gating, fuses the features, and predicts a surgical phase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131f"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50d5ff"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ff3c2"/>
      <stop offset="1" stop-color="#27bda8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bc9cff"/>
      <stop offset="1" stop-color="#7668ff"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#86a8bd" stroke-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7ddcf7"/>
    </marker>
    <style>
      .font{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .card{fill:#102537;stroke:#35566c;stroke-width:2}
      .eyebrow{font-size:19px;font-weight:700;letter-spacing:2.4px;fill:#7fdcf4}
      .heading{font-size:30px;font-weight:760;fill:#f4fbff}
      .label{font-size:22px;font-weight:700;fill:#f2f8fb}
      .small{font-size:17px;font-weight:520;fill:#a9c0cf}
      .tiny{font-size:15px;font-weight:620;fill:#c8d8e1}
      .arrow{fill:none;stroke:#7ddcf7;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="2000" height="800" rx="34" fill="url(#bg)"/>
  <rect width="2000" height="800" rx="34" fill="url(#grid)"/>
  <circle cx="1770" cy="-70" r="390" fill="#2e8cae" opacity="0.10"/>
  <circle cx="165" cy="755" r="300" fill="#5b45c8" opacity="0.10"/>

  <g class="font">
    <text x="64" y="70" class="eyebrow">CURRENT REPOSITORY IMPLEMENTATION</text>
    <text x="64" y="116" class="heading">From an offline instrument prior to a frame-level phase prediction</text>
    <text x="64" y="151" class="small">Solid cards run in this repository · dashed card is an external preprocessing dependency</text>

    <!-- Stage 1: frame -->
    <g filter="url(#shadow)">
      <rect x="55" y="245" width="210" height="330" rx="26" class="card"/>
      <rect x="77" y="270" width="166" height="156" rx="20" fill="#142f42" stroke="#3d647b"/>
      <ellipse cx="160" cy="348" rx="58" ry="42" fill="#d6a77f"/>
      <ellipse cx="160" cy="348" rx="38" ry="38" fill="#678c8c"/>
      <circle cx="160" cy="348" r="18" fill="#273844"/>
      <circle cx="149" cy="336" r="6" fill="#eafaff" opacity="0.9"/>
      <path d="M208 316L171 343" stroke="#dbe8ed" stroke-width="8" stroke-linecap="round"/>
      <path d="M209 317L224 302" stroke="#708896" stroke-width="12" stroke-linecap="round"/>
      <text x="80" y="475" class="label">Surgical frame</text>
      <text x="80" y="510" class="small">RGB image</text>
      <text x="80" y="539" class="small">one frame at a time</text>
    </g>

    <!-- External detector -->
    <g filter="url(#shadow)">
      <rect x="315" y="245" width="220" height="330" rx="26" fill="#182739" stroke="#f2a85b" stroke-width="3" stroke-dasharray="12 10"/>
      <rect x="346" y="284" width="158" height="126" rx="16" fill="#101d2b" stroke="#745b43"/>
      <circle cx="425" cy="347" r="45" fill="#9d765d"/>
      <circle cx="425" cy="347" r="26" fill="#445e68"/>
      <rect x="428" y="309" width="58" height="58" fill="none" stroke="#ffb461" stroke-width="5"/>
      <path d="M476 306h15v15M476 370h15v-15M431 306h-15v15M431 370h-15v-15" fill="none" stroke="#ffcf95" stroke-width="3"/>
      <text x="342" y="459" class="label">YOLO detector</text>
      <text x="342" y="495" class="small">external / offline</text>
      <text x="342" y="524" class="small">not included here</text>
      <rect x="342" y="541" width="142" height="25" rx="12" fill="#f2a85b" opacity="0.16"/>
      <text x="354" y="559" class="tiny" fill="#ffd3a1">PREPROCESSING</text>
    </g>

    <!-- ROI JSON -->
    <g filter="url(#shadow)">
      <rect x="585" y="245" width="220" height="330" rx="26" class="card"/>
      <rect x="611" y="277" width="168" height="75" rx="14" fill="#0a1824" stroke="#33566d"/>
      <text x="630" y="307" class="tiny" fill="#85e7ff">{ x, y, w, h }</text>
      <text x="630" y="334" class="small">bbox JSON</text>
      <rect x="622" y="376" width="146" height="91" rx="14" fill="#061018" stroke="#41677c"/>
      <rect x="683" y="393" width="66" height="51" rx="4" fill="#6ff3c2" opacity="0.86"/>
      <text x="614" y="503" class="label">Binary ROI</text>
      <text x="614" y="538" class="small">first box only</text>
    </g>

    <!-- 4 channel -->
    <g filter="url(#shadow)">
      <rect x="855" y="245" width="220" height="330" rx="26" class="card"/>
      <g transform="translate(903 286)">
        <rect x="30" y="0" width="93" height="115" rx="10" fill="#ef6262" stroke="#ffadad"/>
        <rect x="20" y="12" width="93" height="115" rx="10" fill="#49c989" stroke="#9df4c6"/>
        <rect x="10" y="24" width="93" height="115" rx="10" fill="#5a86f7" stroke="#a7c0ff"/>
        <rect x="0" y="36" width="93" height="115" rx="10" fill="#111d29" stroke="#73f0c5" stroke-width="3"/>
        <rect x="46" y="64" width="33" height="36" rx="3" fill="#6ff3c2"/>
      </g>
      <text x="884" y="475" class="label">RGB + ROI</text>
      <text x="884" y="510" class="small">4-channel tensor</text>
      <text x="884" y="539" class="small">4 × 512 × 512</text>
    </g>

    <!-- Backbone -->
    <g filter="url(#shadow)">
      <rect x="1125" y="245" width="235" height="330" rx="26" class="card"/>
      <g transform="translate(1167 292)">
        <rect x="0" y="75" width="55" height="82" rx="7" fill="url(#blue)" opacity="0.55"/>
        <rect x="49" y="48" width="63" height="109" rx="7" fill="url(#blue)" opacity="0.72"/>
        <rect x="106" y="20" width="72" height="137" rx="7" fill="url(#blue)"/>
        <path d="M27 68V34M80 42V16M142 14V0" stroke="#9cecff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="27" cy="30" r="5" fill="#9cecff"/>
        <circle cx="80" cy="12" r="5" fill="#9cecff"/>
        <circle cx="142" cy="4" r="5" fill="#9cecff"/>
      </g>
      <text x="1156" y="475" class="label">RegNetY-008</text>
      <text x="1156" y="510" class="small">three feature scales</text>
      <text x="1156" y="539" class="small">timm · pretrained</text>
    </g>

    <!-- Attention -->
    <g filter="url(#shadow)">
      <rect x="1410" y="215" width="270" height="390" rx="28" class="card"/>
      <rect x="1437" y="251" width="216" height="74" rx="18" fill="#203251" stroke="#8c83ff"/>
      <circle cx="1474" cy="288" r="18" fill="url(#violet)"/>
      <text x="1505" y="282" class="tiny">Instrument branch</text>
      <text x="1505" y="305" class="small">attention map</text>
      <rect x="1437" y="343" width="216" height="74" rx="18" fill="#173943" stroke="#58dab8"/>
      <circle cx="1474" cy="380" r="18" fill="url(#green)"/>
      <text x="1505" y="374" class="tiny">Ocular branch</text>
      <text x="1505" y="397" class="small">attention map</text>
      <path d="M1474 430v38h72M1616 430v38h-70" fill="none" stroke="#8bddef" stroke-width="3"/>
      <circle cx="1546" cy="468" r="18" fill="#173044" stroke="#8bddef" stroke-width="2"/>
      <text x="1541" y="476" class="small">×</text>
      <rect x="1464" y="499" width="164" height="42" rx="14" fill="#132b3e" stroke="#7ddcf7"/>
      <text x="1494" y="527" class="tiny">fusion + gate</text>
      <text x="1440" y="580" class="small">applied at 3 scales</text>
    </g>

    <!-- Decoder -->
    <g filter="url(#shadow)">
      <rect x="1730" y="245" width="215" height="330" rx="26" class="card"/>
      <g transform="translate(1771 292)">
        <path d="M8 15h108l-20 32H28Z" fill="#356e8c" stroke="#8be8ff"/>
        <path d="M28 59h68l-13 29H42Z" fill="#388aa1" stroke="#98ebff"/>
        <path d="M43 100h40l-7 28H50Z" fill="#51c0bc" stroke="#9bf6dc"/>
        <circle cx="62" cy="158" r="17" fill="url(#green)"/>
      </g>
      <text x="1762" y="475" class="label">Fuse &amp; classify</text>
      <text x="1762" y="510" class="small">decoder + pooling</text>
      <text x="1762" y="539" class="small">16-way logits*</text>
    </g>

    <!-- Arrows -->
    <path d="M265 410H302" class="arrow"/>
    <path d="M535 410H572" class="arrow"/>
    <path d="M805 410H842" class="arrow"/>
    <path d="M1075 410H1112" class="arrow"/>
    <path d="M1360 410H1397" class="arrow"/>
    <path d="M1680 410H1717" class="arrow"/>

    <!-- Legend and notes -->
    <rect x="58" y="654" width="1884" height="92" rx="22" fill="#0a1925" stroke="#29475b"/>
    <circle cx="92" cy="690" r="7" fill="#6ff3c2"/>
    <text x="112" y="697" class="small">YOLO runs outside this repository; the code consumes its precomputed pixel-space boxes.</text>
    <circle cx="92" cy="723" r="7" fill="#bc9cff"/>
    <text x="112" y="730" class="small">The current classifier is frame-level: no temporal model or video smoothing is implemented.</text>
    <text x="1841" y="727" class="tiny" text-anchor="end">* class count follows TRAIN_DIR folders</text>
  </g>
</svg>
